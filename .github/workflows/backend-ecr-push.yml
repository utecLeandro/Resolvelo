# Workflow para construir y publicar la imagen del backend en Amazon ECR
# Ejecuta build multi-stage (target production) y empuja con tags `develop` y `sha`

name: Backend - ECR Push (develop)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de imagen a publicar (default develop)
        required: false
        default: develop
  push:
    branches: [develop]

jobs:
  build-and-push:
    name: Build y Push a ECR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      id-token: write # OIDC para asumir el rol en AWS
      contents: read # Permite checkout del repo

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Preparar metadata de imagen (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag || 'develop' }}
            type=sha,format=short

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:cache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:cache,mode=max

      - name: Publicar resumen
        run: |
          echo "Imagen publicada en: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}" >> $GITHUB_STEP_SUMMARY
          echo "Tags: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
