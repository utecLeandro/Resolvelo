name: 🚀 CI/CD Pipeline - ReSolVelo

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: "18"
  POSTGRES_VERSION: "14"
  # AWS & App Runner Configuration
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  APP_RUNNER_SERVICE_ARN: ${{ secrets.APP_RUNNER_SERVICE_ARN }}
  VPC_CONNECTOR_ARN: ${{ secrets.VPC_CONNECTOR_ARN }}
  AUTO_SCALING_CONFIG_ARN: ${{ secrets.AUTO_SCALING_CONFIG_ARN }}
  DB_SECRET_ARN: ${{ secrets.DB_SECRET_ARN }}
  JWT_SECRET_ARN: ${{ secrets.JWT_SECRET_ARN }}
  APP_RUNNER_INSTANCE_ROLE_ARN: ${{ secrets.APP_RUNNER_INSTANCE_ROLE_ARN }}
  APP_RUNNER_ECR_ACCESS_ROLE_ARN: ${{ secrets.APP_RUNNER_ECR_ACCESS_ROLE_ARN || 'arn:aws:iam::197946144414:role/service-role/AppRunnerECRAccessRole' }}
  MP_ACCESS_TOKEN_ARN: ${{ secrets.MP_ACCESS_TOKEN_ARN }}
  MP_PUBLIC_KEY: ${{ secrets.MP_PUBLIC_KEY }}
  AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}

jobs:
  # 🔍 Análisis de código y linting
  lint:
    name: 🔍 Lint y Formato
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: 📦 Instalar dependencias
        run: npm ci
      - name: 🔍 Ejecutar ESLint
        run: npm run lint
      - name: 🎨 Verificar formato con Prettier
        run: npm run format:check
      - name: 📝 Verificar convenciones de commits
        if: github.event_name == 'pull_request'
        uses: wagoid/commitlint-github-action@v5

  # 🧪 Tests unitarios y de integración
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resolvelo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: 📦 Instalar dependencias
        run: npm ci
      - name: 🗄️ Configurar base de datos de prueba
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resolvelo_test
        run: |
          npx prisma db push
          npx prisma generate
      - name: 🧪 Ejecutar tests unitarios
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resolvelo_test
          JWT_SECRET: test-secret-key
          NODE_ENV: test
        run: npm run test
      - name: 📊 Generar reporte de cobertura
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resolvelo_test
          JWT_SECRET: test-secret-key
          NODE_ENV: test
        run: npm run test:cov
      - name: 📈 Subir cobertura a Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  # 🔒 Análisis de seguridad
  security:
    name: 🔒 Análisis de Seguridad
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: 📦 Instalar dependencias
        run: npm ci
      - name: 🔍 Auditoría de dependencias
        run: npm audit --audit-level moderate

  # 🏗️ Build y validación
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: 📦 Instalar dependencias
        run: npm ci
      - name: 🔧 Generar cliente Prisma
        run: npx prisma generate
      - name: 🏗️ Build de la aplicación
        run: npm run build
      - name: 📦 Verificar artefactos de build
        run: |
          ls -la dist/
          echo "✅ Build completado exitosamente"

  # 📊 Análisis de calidad de código
  sonarcloud:
    name: 📊 SonarCloud
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'pull_request'
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 📊 Análisis SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # 🚀 Build & Deploy to App Runner
  deploy:
    name: Build & Deploy to App Runner
    runs-on: ubuntu-latest
    needs: [lint, test, security, build]
    if: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) || github.event_name == 'workflow_dispatch' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configuration (develop)
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          echo "🔎 Validando configuración requerida para deploy en App Runner (develop)"
          missing=0
          check() {
            var="$1"
            if [ -z "${!var:-}" ]; then
              echo "❌ Falta variable: $var"
              missing=1
            else
              echo "✅ $var configurada"
            fi
          }

          check AWS_REGION
          check ECR_REPOSITORY
          check AWS_DEPLOY_ROLE_ARN
          # Opcionales
          echo "ℹ️ Variables opcionales (no bloquean si faltan)"
          [ -z "${VPC_CONNECTOR_ARN:-}" ] && echo "⚠️ VPC_CONNECTOR_ARN no configurada" || echo "✅ VPC_CONNECTOR_ARN configurada"
          [ -z "${AUTO_SCALING_CONFIG_ARN:-}" ] && echo "⚠️ AUTO_SCALING_CONFIG_ARN no configurada" || echo "✅ AUTO_SCALING_CONFIG_ARN configurada"

          # Configuración de Roles
          check APP_RUNNER_INSTANCE_ROLE_ARN
          check APP_RUNNER_ECR_ACCESS_ROLE_ARN

          # Secretos de entorno
          check DB_SECRET_ARN
          check JWT_SECRET_ARN
          check MP_ACCESS_TOKEN_ARN
          check MP_PUBLIC_KEY
          check AWS_S3_BUCKET_NAME

          if [ "$missing" -ne 0 ]; then
            echo "🚫 Configuración incompleta. Revisa Secrets/Vars del repositorio."
            exit 1
          fi

          if [ -z "${APP_RUNNER_SERVICE_ARN:-}" ]; then
            echo "ℹ️ APP_RUNNER_SERVICE_ARN no configurada: se intentará crear el servicio y obtener el ARN automáticamente"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          IMAGE_URI="$ECR_REGISTRY/${ECR_REPOSITORY}:$IMAGE_TAG"
          echo "Building $IMAGE_URI"
          docker build --no-cache --pull -t "$IMAGE_URI" -f Dockerfile .
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Update or Create App Runner service
        id: apprunner
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          echo "Using image: $IMAGE_URI"

          # Preparar archivos de configuración JSON
          printf '{
            "ImageRepository": {
              "ImageIdentifier": "%s",
              "ImageRepositoryType": "ECR",
              "ImageConfiguration": {
                "Port": "3000",
                "RuntimeEnvironmentVariables": {
                  "NODE_ENV": "production",
                  "PORT": "3000",
                  "PRISMA_MIGRATE_DEPLOY": "1",
                  "MP_PUBLIC_KEY": "%s",
                  "AWS_REGION": "%s",
                  "AWS_S3_BUCKET_NAME": "%s"
                },
                "RuntimeEnvironmentSecrets": {
                  "DATABASE_URL": "%s",
                  "JWT_SECRET": "%s",
                  "MP_ACCESS_TOKEN": "%s"
                }
              }
            },
            "AuthenticationConfiguration": {
              "AccessRoleArn": "%s"
            }
          }' "$IMAGE_URI" "${MP_PUBLIC_KEY}" "${AWS_REGION}" "${AWS_S3_BUCKET_NAME}" "${DB_SECRET_ARN}" "${JWT_SECRET_ARN}" "${MP_ACCESS_TOKEN_ARN}" "${APP_RUNNER_ECR_ACCESS_ROLE_ARN}" > source-config.json

          printf '{
            "InstanceRoleArn": "%s"
          }' "${APP_RUNNER_INSTANCE_ROLE_ARN}" > instance-config.json

          # Configuración de red (VPC Connector)
          if [ -n "${VPC_CONNECTOR_ARN:-}" ]; then
            echo "ℹ️ Configurando salida a VPC: $VPC_CONNECTOR_ARN"
            printf '{
              "EgressConfiguration": {
                "EgressType": "VPC",
                "VpcConnectorArn": "%s"
              }
            }' "$VPC_CONNECTOR_ARN" > network-config.json
          else
            echo "ℹ️ Configurando salida a Internet pública (DEFAULT)"
            printf '{
              "EgressConfiguration": {
                "EgressType": "DEFAULT"
              }
            }' > network-config.json
          fi

          DESCRIBE_RC=1
          if [ -n "${APP_RUNNER_SERVICE_ARN:-}" ]; then
            set +e
            aws apprunner describe-service --service-arn "$APP_RUNNER_SERVICE_ARN" > /dev/null 2>&1
            DESCRIBE_RC=$?
            set -e
          else
            echo "ℹ️ No hay ARN configurado, se procederá a crear el servicio"
          fi

          if [ "$DESCRIBE_RC" -eq 0 ]; then
            echo "🔄 Actualizando servicio existente: $APP_RUNNER_SERVICE_ARN"
            aws apprunner update-service \
              --service-arn "$APP_RUNNER_SERVICE_ARN" \
              --source-configuration file://source-config.json \
              --instance-configuration file://instance-config.json \
              --network-configuration file://network-config.json
          else
            echo "🆕 Creando nuevo servicio App Runner: resolvelo-backend"
            SERVICE_ARN=$(aws apprunner create-service \
              --service-name "resolvelo-backend" \
              --source-configuration file://source-config.json \
              --instance-configuration file://instance-config.json \
              --network-configuration file://network-config.json \
              ${AUTO_SCALING_CONFIG_ARN:+--auto-scaling-configuration-arn "$AUTO_SCALING_CONFIG_ARN"} \
              --query 'Service.ServiceArn' --output text)
            
            echo "✅ Servicio creado con éxito. ServiceArn: $SERVICE_ARN"
            echo "service_arn=$SERVICE_ARN" >> $GITHUB_OUTPUT
            echo "⚠️ IMPORTANTE: Guarda este ARN en el secret APP_RUNNER_SERVICE_ARN"
          fi

      - name: Output service status
        run: |
          aws apprunner describe-service --service-arn "$APP_RUNNER_SERVICE_ARN" || true

  # 📝 Comentario en PR con resultados
  pr-comment:
    name: 📝 Comentario en PR
    runs-on: ubuntu-latest
    needs: [lint, test, build, security]
    if: github.event_name == 'pull_request'
    steps:
      - name: 📝 Comentar resultados en PR
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('🤖 Resultados del CI/CD')
            );

            const body = `## 🤖 Resultados del CI/CD

            ✅ **Lint**: Pasado
            ✅ **Tests**: Pasado  
            ✅ **Build**: Pasado
            ✅ **Seguridad**: Pasado

            🎉 **¡Todos los checks han pasado!** Este PR está listo para revisión.

            ---
            *Generado automáticamente por GitHub Actions*`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
