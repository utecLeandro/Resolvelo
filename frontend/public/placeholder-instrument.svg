<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#f3f4f6"/>
  
  <!-- Musical note icon -->
  <g transform="translate(150, 80)">
    <!-- Note stem -->
    <rect x="45" y="20" width="3" height="80" fill="#6b7280"/>
    
    <!-- Note head -->
    <ellipse cx="42" cy="100" rx="8" ry="6" fill="#6b7280"/>
    
    <!-- Musical staff lines -->
    <line x1="10" y1="60" x2="90" y2="60" stroke="#9ca3af" stroke-width="1"/>
    <line x1="10" y1="70" x2="90" y2="70" stroke="#9ca3af" stroke-width="1"/>
    <line x1="10" y1="80" x2="90" y2="80" stroke="#9ca3af" stroke-width="1"/>
    <line x1="10" y1="90" x2="90" y2="90" stroke="#9ca3af" stroke-width="1"/>
    <line x1="10" y1="100" x2="90" y2="100" stroke="#9ca3af" stroke-width="1"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="180" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="16" font-weight="500">
    Imagen no disponible
  </text>
  
  <!-- Instrument silhouette -->
  <g transform="translate(180, 200)">
    <!-- Guitar body outline -->
    <path d="M20 10 C30 5, 40 5, 50 10 L50 40 C50 50, 40 55, 30 55 L20 55 C10 55, 0 50, 0 40 L0 10 C0 5, 10 0, 20 10 Z" 
          fill="none" stroke="#9ca3af" stroke-width="2"/>
    <!-- Guitar neck -->
    <rect x="15" y="-10" width="10" height="20" fill="none" stroke="#9ca3af" stroke-width="2"/>
    <!-- Sound hole -->
    <circle cx="25" cy="30" r="8" fill="none" stroke="#9ca3af" stroke-width="2"/>
  </g>
</svg>