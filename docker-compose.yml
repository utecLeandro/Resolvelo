# ============================================================================
# DOCKER COMPOSE PARA RESOLVELO - DESARROLLO LOCAL
# ============================================================================
# Este archivo define todos los servicios necesarios para ejecutar
# ReSolVelo (plataforma de alquiler de equipos musicales) en un entorno 
# de desarrollo local, incluyendo base de datos, backend, y servicios auxiliares.
# ============================================================================

version: '3.8'

services:
  # ==========================================================================
  # BASE DE DATOS POSTGRESQL
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: resolvelo-postgres
    restart: unless-stopped
    environment:
      # Configuración de la base de datos
      POSTGRES_DB: resolvelo_db
      POSTGRES_USER: resolvelo_user
      POSTGRES_PASSWORD: resolvelo_password_2024
      # Configuración de rendimiento
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      # Persistencia de datos
      - postgres_data:/var/lib/postgresql/data
      # Scripts de inicialización
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - resolvelo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolvelo_user -d resolvelo_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================================================
  # REDIS PARA CACHE Y SESIONES
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: resolvelo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass resolvelo_redis_2024
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - resolvelo-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==========================================================================
  # BACKEND API (NESTJS)
  # ==========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: resolvelo-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Configuración de la aplicación
      NODE_ENV: development
      PORT: 3000
      
      # Base de datos
      DATABASE_URL: postgresql://resolvelo_user:resolvelo_password_2024@postgres:5432/resolvelo_db?schema=public
      
      # Redis
      REDIS_URL: redis://:resolvelo_redis_2024@redis:6379
      
      # JWT y seguridad
      JWT_SECRET: resolvelo_jwt_secret_key_2024_super_secure
      JWT_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 12
      
      # Configuración de archivos
      MAX_FILE_SIZE: 10485760  # 10MB
      UPLOAD_PATH: /app/uploads
      
      # Configuración de email (para desarrollo)
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASS: ""
      EMAIL_FROM: noreply@resolvelo.com
      
      # URLs del frontend
      FRONTEND_URL: http://localhost:5174
      # Permitir ambos orígenes en desarrollo (Vite por defecto 5173/5174 y Adminer 8080 si fuese necesario)
      CORS_ORIGIN: http://localhost:5174,http://localhost:8080
      
      # Configuración de pagos (mock para desarrollo)
      PAYMENT_GATEWAY_URL: http://localhost:3000/api/mock-payments
      PAYMENT_GATEWAY_KEY: mock_key_development
      
      # Configuración de verificación (mock para desarrollo)
      VERIFICATION_SERVICE_URL: http://localhost:3000/api/mock-verification
      VERIFICATION_SERVICE_KEY: mock_verification_key
      
    ports:
      - "3000:3000"
    volumes:
      # Volumen para archivos subidos
      - uploads_data:/app/uploads
      # Logs de la aplicación
      - ./logs:/app/logs
    networks:
      - resolvelo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================================================
  # MAILHOG PARA TESTING DE EMAILS
  # ==========================================================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: resolvelo-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - resolvelo-network

  # ==========================================================================
  # ADMINER PARA ADMINISTRACIÓN DE BD
  # ==========================================================================
  adminer:
    image: adminer:latest
    container_name: resolvelo-adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    networks:
      - resolvelo-network

  # ==========================================================================
  # NGINX PARA PROXY REVERSO (OPCIONAL)
  # ==========================================================================
  nginx:
    image: nginx:alpine
    container_name: resolvelo-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - uploads_data:/var/www/uploads:ro
    networks:
      - resolvelo-network
    profiles:
      - production

# ============================================================================
# VOLÚMENES PERSISTENTES
# ============================================================================
volumes:
  # Datos de PostgreSQL
  postgres_data:
    driver: local
    
  # Datos de Redis
  redis_data:
    driver: local
    
  # Archivos subidos por usuarios
  uploads_data:
    driver: local

# ============================================================================
# REDES
# ============================================================================
networks:
  resolvelo-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16